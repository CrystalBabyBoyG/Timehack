<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#0a0a0a"/>
  <!-- Clock face -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="3.5"/>
  <!-- Hour ticks -->
  <line x1="50" y1="19" x2="50" y2="26" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="81" y1="50" x2="74" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="81" x2="50" y2="74" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="19" y1="50" x2="26" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Hour hand (10 o'clock) -->
  <line x1="50" y1="50" x2="31" y2="39" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand (2 o'clock) -->
  <line x1="50" y1="50" x2="76" y2="35" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3.5" fill="white"/>
</svg>
